<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git 学习任务清单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <header class="hero">
        <p class="eyebrow">Static Web Project</p>
        <h1>Git 学习任务清单（冲突已解决：主分支 + 功能分支）</h1>
        <p class="subtitle">通过一个简单网页，配合手动输入 Git 命令，逐步完成 Git 学习练习。</p>
      </header>

      <section class="progress" aria-label="学习进度">
        <p>已完成任务：<strong id="completed-count">0</strong></p>
      </section>

      <section aria-labelledby="task-list-title">
        <div class="section-heading">
          <h2 id="task-list-title">当前任务</h2>
          <p>点击按钮即可将对应任务标记为已完成。</p>
        </div>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
